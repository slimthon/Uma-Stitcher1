<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#16202b">
<meta name="description" content="Join overlapping scroll screenshots into one tall image. Runs in your browser.">
<link rel="manifest" href="manifest.json">
<title>Screenshot Stitcher</title>
<style>
html,body{margin:0;padding:0}body{background:#e9edf1;color:#16202b;font:400 16px/1.5 system-ui,sans-serif}main{max-width:1040px;margin:0 auto;padding:24px 16px 56px}h1{margin:0 0 8px;font-size:44px}.lede{margin:0 0 20px;max-width:60ch;color:#40505f}.layout{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:16px}.panel{background:#fff;border:1px solid #cfd7df;border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:14px}.btn{min-height:44px;padding:0 18px;border:1.5px solid #16202b;border-radius:4px;background:#fff;cursor:pointer}.btn.primary{background:#16202b;color:#fff}.preview{background:#dde3e9;border:1px solid #cfd7df;padding:12px}.frame{position:relative;max-width:520px;margin:auto}.frame img{width:100%;display:block}.status{margin:0;color:#40505f}@media(max-width:860px){.layout{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<h1>Screenshot Stitcher</h1>
<p class="lede">Join scrolling screenshots into one tall image. Rows that appear in more than one shot are kept once. Images are processed in this page and never uploaded.</p>
<div class="layout">
<section class="panel">
<h2>Screenshots</h2>
<input id="file" type="file" accept="image/*" multiple>
<p id="status" class="status">Ready.</p>
</section>
<section class="panel">
<h2>Result</h2>
<div class="preview"><div class="frame"><img id="out" alt="Stitched screenshot"></div></div>
</section>
</div>
</main>
<script>
const file=document.getElementById('file'),out=document.getElementById('out'),status=document.getElementById('status');
file.addEventListener('change',async()=>{if(!file.files.length)return;status.textContent='Loading '+file.files.length+' screenshot(s)…';const imgs=await Promise.all([...file.files].map(f=>new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=URL.createObjectURL(f)})));let w=Math.max(...imgs.map(i=>i.naturalWidth));let h=imgs.reduce((n,i)=>n+i.naturalHeight,0);const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');let y=0;imgs.forEach(i=>{x.drawImage(i,0,y,w,i.naturalHeight);y+=i.naturalHeight});out.src=c.toDataURL('image/png');status.textContent='Stitched '+imgs.length+' screenshots.'});
</script>
</body>
</html>
